title = "Nuvio gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Official Nuvio Cloud publishable key used by self-hosted imports"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN$''']
paths = [
  '''^\.env\.example$''',
  '''^scripts/import-account\.sh$''',
]
