x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      kong:
        condition: service_healthy
      account-dashboard:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NUVIO_PROXY_PORT:-8080}:80"
    environment:
      NUVIO_CADDY_CONFIG_VERSION: "discovery-v1"
      NUVIO_CADDY_ADDRESS: :80
      ANON_KEY: ${ANON_KEY}
    volumes:
      - ./volumes/proxy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
      proxy:
        aliases:
          - nuvio-gateway

volumes:
  caddy-data:
  caddy-config:

networks:
  proxy:
    name: ${NUVIO_PROXY_NETWORK:-nuvio-proxy}
    external: true
